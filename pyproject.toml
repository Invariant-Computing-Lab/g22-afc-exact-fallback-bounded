[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "invariant-v7-g22"
version = "0.1.1"
description = "Bounded offline G22 validation prototype; not recovered upstream software"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
invariant-g22 = "invariant_v7_g22:main"

[tool.setuptools]
py-modules = ["invariant_v7_g22"]
